# Saa9vi multi-tenant storefront — nginx reverse proxy config (NO njs required)
#
# Alternative to saa9vi-storefront.conf that implements the same
# hostname → channel-token contract using the compiled-in
# http_auth_request_module (present in standard nginx builds:
# `nginx -V` → --with-http_auth_request_module). No js_path/js_import,
# no libnginx-mod-http-js install needed.
#
# Contract (identical to the njs config and the Caddyfile):
#
#   client → nginx
#     → internal auth subrequest GET /api/resolve-channel?hostname=$host
#     → 200: x-saa9vi-channel-token response header captured (always present:
#       real token or '' — see src/app/api/resolve-channel/route.ts)
#       → UNCONDITIONAL proxy_set_header overwrite → Next.js
#     → 403: public hostname has no Redis mapping (Redis healthy) → nginx
#       denies; the request never reaches Next.js (B-6 fail-closed). A 500 on
#       the same path means the resolution lookup is misconfigured, and also
#       denies.
#
# Live-verified 2026-09-16 against the local stack (see the backend
# integration-gaps-worklist.md, B-3/B-5 sections):
#   - tenant host + own product   → 200, full SSR product page
#   - tenant host + other product → "Page Not Found" rendered
#   - spoofed x-saa9vi-channel-token from client → neutralized (overwritten)
#   - control: direct to :3001 with spoofed token → other tenant's page
#     RENDERS (the overwrite at the proxy is what closes B-5)
#
upstream storefront {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name academy-a.example.com academy-b.example.com;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    # SECURITY: keep underscores_in_headers ON so a client-spoofed
    # x-saa9vi-channel-token actually reaches nginx and can be proven
    # overwritten (nginx otherwise silently drops underscore headers,
    # which would mask the spoof test rather than defeat it).
    underscores_in_headers on;

    # Internal-only resolution endpoint. Not reachable directly from
    # outside — `internal;` enforces that.
    location = /_resolve_channel {
        internal;
        # The route handler reads ?hostname= — do not rely on Host being
        # forwarded implicitly; pass it explicitly.
        proxy_pass http://storefront/api/resolve-channel?hostname=$host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # Fail fast: if the storefront/Redis is slow or down, don't hang
        # every request on this subrequest.
        #
        # Status handling (B-6, 2026-09-24): resolve-channel returns 200 (real
        # token, or '' for a Redis outage) OR 403 (Redis healthy, public
        # hostname unmapped) OR 500 (resolution misconfigured). auth_request
        # forwards only 2xx/401/403 to the client and converts any other status
        # into a 500, so the route must keep using 403 for the "unknown
        # hostname" denial — never 404. A 200 with '' is still the intended
        # env-var fallback (deploy/VERIFY.md §3); the unmapped-hostname case is
        # now closed by the 403. Note that nginx does not forward an
        # empty-valued proxy_set_header, so downstream "''" and "absent" are
        # indistinguishable — which is exactly why the denial is expressed as a
        # status rather than a header value.
        proxy_connect_timeout 300ms;
        proxy_read_timeout 300ms;
    }

    location / {
        auth_request /_resolve_channel;
        # Capture the resolution result from the subrequest response.
        auth_request_set $saa9vi_token $upstream_http_x_saa9vi_channel_token;

        # UNCONDITIONAL overwrite — same contract as Caddyfile's
        # copy_headers and the njs config's js_var assignment. Because
        # resolve-channel ALWAYS sets the header on a 200, $saa9vi_token is
        # always defined for every request that reaches this location (a
        # 403/500 subrequest is denied and never arrives here) and no
        # client-supplied value can survive upstream.
        proxy_set_header x-saa9vi-channel-token $saa9vi_token;

        proxy_pass http://storefront;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Marketplace (cross-tenant, no channel resolution needed — served as-is).
server {
    listen 443 ssl http2;
    server_name marketplace.saa9vi.com;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    location / {
        proxy_pass http://storefront;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Deliberately no x-saa9vi-channel-token here — marketplaceSearch
        # is cross-tenant by design (see queryPublic() in lib/vendure/api.ts).
    }
}
